<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>John A. Paz | Writer, Speaker, Human</title>
  <meta name="description" content="Curious, Creative, Clever. Explore John A. Paz’s projects, writing, and practical guides." />
  {% if site.staging %}<meta name="robots" content="noindex, nofollow" />{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/bootstrap-controls-v2.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/home-v2.css' | relative_url }}" />
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}" />
</head>
<body class="v2-home">
  <a class="v2-skip" href="#main-content">Skip to content</a>
  {% include v2-navigation.html %}
  <main id="main-content" class="v2-shell">
    {% include v2-introduction.html %}
    <section class="v2-content" id="writing" aria-labelledby="content-title">
      <h2 id="content-title" class="v2-sr-only">Explore my work and writing</h2>
      <div class="v2-grid">
        {% for card in site.data.home.cards %}
        <article class="v2-card">
          <a href="{% if card.url contains '://' %}{{ card.url }}{% else %}{{ card.url | relative_url }}{% endif %}">
            <h3>{{ card.title | escape }}</h3>
          </a>
        </article>
        {% endfor %}
      </div>
      <footer class="v2-bottom"><p>Have something in mind?</p><a href="mailto:{{ site.email }}">Let’s talk <span aria-hidden="true">↗</span></a></footer>
    </section>
  </main>
  <script src="{{ '/assets/js/home-v2.js' | relative_url }}" defer></script>
</body>
</html>
