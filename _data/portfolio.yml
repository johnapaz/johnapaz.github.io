projects:
- id: confluence-migration
  title: Making a documentation migration manageable
  category: Airbnb · Documentation operations
  description: An operational problem became a family of focused tools that teammates could use with confidence.
  challenge: Thousands of repetitive Confluence changes would have taken hundreds of hours through the interface.
  contribution: Defined requirements, operator workflows, safeguards, and documentation; directed AI-assisted implementation;
    reviewed and tested the original tools in the working environment.
  result: Six teammates used the original tool family. Together, the tools saved hundreds of hours and helped complete
    the migration ahead of schedule. The linked public sample is a sanitized reconstruction of one workflow, with
    offline tests; it has not been tested against a live Confluence instance.
  tags:
  - Python
  - Confluence REST API
  - CLI
  - Knowledge migration
  url: https://github.com/johnapaz/confluence-automation-toolkit-sample
  action: Explore the repository
  secondary_url: /coding/
  secondary_action: See the coding view
- id: portfolio-site
  title: Building a publishing home that tells a story
  category: johnapaz.com · Web design & development
  description: A portfolio and publishing space designed to make a broad body of work easier to explore.
  challenge: Bring writing, career history, projects, and speaking together without making every page compete for
    attention.
  contribution: Set the voice, canyon palette direction, spacing, section hierarchy, and Bootstrap-style controls;
    direct and review AI-assisted development through successive prototypes.
  result: A V2 site with paired views, structured catalogs, responsive layouts, and separate build validation and
    staging publication. The repository and wiki preserve design decisions and implementation history.
  tags:
  - Jekyll
  - Liquid
  - Sass
  - JavaScript
  - GitHub Pages
  url: https://github.com/johnapaz/johnapaz.github.io/tree/v2
  action: Read the source & README
  secondary_url: https://github.com/johnapaz/johnapaz.github.io/wiki
  secondary_action: Explore the project wiki
- id: developer-docs
  title: Making an API concept easier to find
  category: Atlassian · Developer documentation
  description: Restructuring Bitbucket’s API proxy and object hydration documentation.
  challenge: Object hydration was buried in a growing API proxy reference page, making the concept difficult to
    find and understand.
  contribution: Identified the need for a separate object hydration page, restructured the information architecture,
    and partnered with an engineer on focused examples.
  result: Separate reference pages clarified object hydration and its relationship to the broader API workflow.
    The sample packet includes the context and deliverables.
  tags:
  - APIs
  - Bitbucket
  - Technical writing
  url: /assets/docs/John_Paz_API_Technical_Writer_work-samples_09152026_Bloomberg.docx
  action: Download the developer sample packet
- id: content-design
  title: Making complex products easier to understand
  category: Content design · Product experience
  description: Selected content design work from my portfolio.
  challenge: Help users find the right information and understand what to do next in complex product experiences.
  contribution: Apply information architecture, UX writing, content standards, and collaboration with product teams.
  result: Selected artifacts collected in a content design portfolio, with context for the work and my contribution.
  tags:
  - UX writing
  - Information architecture
  - Content strategy
  url: /assets/docs/John_Paz_Content_Design_Samples_042424.pdf
  action: Download the content design portfolio
