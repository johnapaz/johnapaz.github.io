{% assign meta_title = page.title | default: site.title %}
{% assign meta_description = page.description | default: site.description %}
{% assign meta_image = page.image | default: '/assets/images/launch-v1-v2.png' %}
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta property="og:type" content="{% if page.layout == 'article-v2' and page.date %}article{% else %}website{% endif %}" />
<meta property="og:site_name" content="John A. Paz" />
<meta property="og:title" content="{{ meta_title | escape }}" />
<meta property="og:description" content="{{ meta_description | escape }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:image" content="{{ meta_image | absolute_url }}" />
<meta property="og:image:alt" content="{{ page.image_alt | default: 'John A. Paz website, V1 and V2 side by side' | escape }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ meta_title | escape }}" />
<meta name="twitter:description" content="{{ meta_description | escape }}" />
<meta name="twitter:image" content="{{ meta_image | absolute_url }}" />
{% if page.layout == 'article-v2' and page.date %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","headline":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"image":{{ meta_image | absolute_url | jsonify }},"datePublished":{{ page.date | date_to_xmlschema | jsonify }},"author":{"@type":"Person","name":"John A. Paz","url":{{ '/about/' | absolute_url | jsonify }}},"mainEntityOfPage":{{ page.url | absolute_url | jsonify }}}</script>{% endif %}
