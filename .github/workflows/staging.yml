name: Validate staging build
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JEKYLL_ENV: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler: '2.4.22'
      - name: Install dependencies
        run: |
          bundle install
      - name: Build staging
        run: |
          bundle exec jekyll build --safe --config _config.yml,_config.staging.yml
          printf 'staging.johnapaz.com\n' > _site/CNAME
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          printf '{"branch":"v2","commit":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/build-info.json
          python3 scripts/check-staging.py
      - uses: actions/upload-artifact@v4
        with:
          name: staging-site
          path: _site
          include-hidden-files: true
